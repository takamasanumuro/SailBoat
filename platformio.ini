; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared between environments
[common]
platform = atmelavr
framework = arduino
board = megaatmega2560
monitor_speed = 9600
monitor_echo = yes
monitor_filters =
    send_on_enter
    colorize
lib_deps = 
    https://github.com/tomstewart89/Callback.git

; Main production environment - Full sailboat autopilot system
[env:main]
extends = common
build_flags = 
    -D ENVIRONMENT_MAIN=1
    -D SERIAL_DEBUG=1
    -D PID_DEBUG=1
    -Wall
    -Wextra
build_type = release

; Sketch environment - For testing and experimentation
[env:sketch]
extends = common
build_src_filter = -<*> +<../src_sketch>
build_flags = 
    -D ENVIRONMENT_SKETCH=1
    -D SERIAL_DEBUG=1
    -D SKETCH_MODE=1
    -Wall
    -Wextra
build_type = debug